workflows:
  ios-build:
    name: Build iOS IPA
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Desactivar Swift Package Manager en Flutter
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Instalar dependencias Flutter
        script: |
          flutter packages pub get
      - name: Alinear versiones nativas de TensorFlow Lite
        script: |
          ruby tool/align_tflite_ios_podspec.rb
      - name: Instalar dependencias nativas de iOS
        script: |
          cd ios
          pod install --repo-update
          cd ..
      - name: Verificar pods de TensorFlow Lite
        script: |
          cd ios
          echo "--- Pods de TensorFlow Lite instalados ---"
          grep -E 'TensorFlowLite' Podfile.lock || true
          ls -d Pods/TensorFlowLiteSelectTfOps/Frameworks/TensorFlowLiteSelectTfOps.xcframework
          cd ..
      - name: Compilar iOS Release
        script: |
          flutter build ios --release --no-codesign
      - name: Verificar delegate Select TF Ops en el binario
        script: |
          BIN="build/ios/iphoneos/Runner.app/Runner"
          echo "--- Simbolos Flex en el binario final ---"
          xcrun nm -g "$BIN" | grep -i flex || echo "(sin simbolos flex)"
          if xcrun nm -g "$BIN" | grep -q '_TF_AcquireFlexDelegate'; then
            echo "OK: _TF_AcquireFlexDelegate esta presente en el binario."
          else
            echo "AVISO: _TF_AcquireFlexDelegate NO esta en el binario. TFLite no podra aplicar el delegate Flex y la inferencia fallara con 'Unable to create interpreter'."
          fi
      - name: Empaquetar a IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload
          zip -r serene-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa