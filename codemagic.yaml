workflows:
  ios-build:
    name: Build iOS IPA
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Desactivar Swift Package Manager en Flutter
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Instalar dependencias Flutter
        script: |
          flutter packages pub get
      - name: Resolver dependencias nativas de iOS
        script: |
          cd ios
          pod install --repo-update
          cd ..
      - name: Compilar iOS Release
        script: |
          flutter build ios --release --no-codesign
      - name: Empaquetar a IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload
          zip -r serene-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa