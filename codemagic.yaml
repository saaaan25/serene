workflows:
  ios-build:
    name: Build iOS IPA
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Desactivar Swift Package Manager en Flutter
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Instalar dependencias Flutter
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter pub get
      - name: Alinear versiones nativas de TensorFlow Lite
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          ruby tool/align_tflite_ios_podspec.rb
      - name: Generar configuracion Flutter para iOS
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter build ios --config-only --release --no-codesign --no-pub
          test -s ios/Flutter/Generated.xcconfig
      - name: Instalar dependencias nativas de iOS
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios"
          test -s Flutter/Generated.xcconfig
          pod update TensorFlowLiteSwift TensorFlowLiteC --repo-update
          cd ..
      - name: Verificar pods de TensorFlow Lite
        script: |
          ruby -ryaml -e 'lock = YAML.load_file("ios/Podfile.lock"); names = lock.fetch("PODS").flat_map { |p| p.is_a?(Hash) ? p.keys : [p] }; %w[TensorFlowLiteC TensorFlowLiteSwift].each { |name| abort("Version incorrecta o pod ausente: #{name}") unless names.include?("#{name} (2.17.0)") }; abort("Select TF Ops no debe estar instalado") if names.any? { |n| n.start_with?("TensorFlowLiteSelectTfOps") }; puts names.grep(/TensorFlowLite/)'
      - name: Compilar iOS Release
        script: |
          flutter build ios --release --no-codesign
      - name: Empaquetar a IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload
          zip -r serene-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa
